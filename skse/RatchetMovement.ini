; Ratchet Movement (SKSE plugin): Rift Apart movement through libratchet.
; Lives next to RatchetMovement.dll in Data\SKSE\Plugins. Read at game start.

[General]
; 0 turns the plugin off: Skyrim's own jump comes back.
bEnabled = 1
; Character scale: 1 = Ratchet-sized (his own size and Rift Apart's own numbers: a 1.5 m jump),
; 1.55 = Dragonborn-sized (everything 1.55 times bigger).
fScale = 1.0
; Folder with the Rift Apart configs (tools/extract_riftapart_configs.py's JSON). A relative path
; is from this folder. If it's missing, libratchet's built-in tuning is used.
sConfigsDir = RatchetMovement
; Skyrim's own jump animations (start, fall, land) on libratchet's jumps.
bAnimations = 1
; Ratchet himself (his model and his own clips) instead of the Dragonborn. Needs the files
; skse\tools\ratchet_to_skyrim.py makes from your extracted model (build.ps1 -Install does it).
bRatchet = 1
; Clank on his back, his heli-pack out while Ratchet glides (the same tool makes his files).
bClank = 1
; The Skyrim control that dashes (on the ground and in the air), by its name in Skyrim's controls:
; Sprint by default (Left Alt, or LB on a gamepad), whose own sprint is then off on foot. Empty:
; no dash.
sDashControl = Sprint
; libratchet walks and runs him too (Rift Apart's speeds and quick starts), not only his jumps and
; dashes. 0: Skyrim's own locomotion moves him on the ground.
bSimGround = 1
; Skyrim's own ground movement carries out his moves on the ground (its slopes, stairs and small
; edges, at Rift Apart's speed). 0: the plugin moves him itself (an older way, kept to compare).
bNativeGround = 1
; Rift Apart's follow camera on foot: its framing (further back and wider while he runs, over his
; right shoulder while he aims), field of view and shakes. 0: Skyrim's own camera.
bRiftCamera = 1
; Rift Apart's sounds on his moves (skse\tools\ratchet_sounds_to_skyrim.py makes them), and how
; loud they are.
bSounds = 1
fSoundVolume = 1.0

[Combat]
; Ratchet's OmniWrench and Burst Pistol. On foot they take these Skyrim controls, whose own
; attacks, blocks, weapon drawing and shouts are then off (Rift Apart's controller layout: R2
; fires, L2 aims, Square swings, R1 throws). 0 gives Skyrim's fighting back.
bCombat = 1
sFireControl = Right Attack/Block
sAimControl = Left Attack/Block
sMeleeControl = Ready Weapon
sThrowControl = Shout
; The controls that pick his gun: the Burst Pistol, or the Shatterbomb (hold fire to wind the
; throw up, let go to throw). Hotkey1 and Hotkey2 are the keyboard's 1 and 2; Skyrim's favorites
; on those two hotkeys don't equip on foot then.
sPistolControl = Hotkey1
sShatterbombControl = Hotkey2
; Rift Apart's damage numbers times this (Skyrim's difficulty scales them too).
fDamageMult = 1.0
; The sandbox's "+" crosshair in the middle of the screen while Rift Apart's camera is on (Skyrim
; shows none in third person with no weapon drawn). 0: none (another mod's crosshair, say).
bCrosshair = 1

[Debug]
; One log line per jump: takeoff, apex height and time, landing, next to the sandbox's numbers.
; The log is Documents\My Games\Skyrim Special Edition\SKSE\RatchetMovement.log.
bLogJumps = 1
; Every frame of every jump (big logs).
bTraceJumps = 0
; Automated tests in the game: see skse/test/ingame.ps1 (it drops a one-shot
; RatchetMovement\autotest.ini next to this file).
