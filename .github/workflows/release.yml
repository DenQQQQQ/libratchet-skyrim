# Builds the SKSE plugin, ratchet.dll and the GDeflate decoder, and makes the release zip
# (skse/package.ps1): this project's own files only, no game data. Run it from the Actions tab
# (Release, Run workflow, with the version); the zip is the run's artifact. Test it in the game,
# then publish it: gh release create v<version> RatchetMovement-<version>.zip
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0"
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      # vcpkg with its full history: skse/vcpkg.json pins a baseline commit.
      - name: vcpkg
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Build and package
        shell: powershell
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          ./skse/package.ps1 -Version "${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: RatchetMovement-${{ inputs.version }}
          path: target/release-pkg/*.zip
